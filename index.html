<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06100c"><link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes"><title>EcoPulse</title>
<style>
:root{--bg:#06100c;--card:#0e1d16;--line:#1c3327;--tx:#e8f5ee;--mu:#82a393;--g:#3ddc84;--y:#ffc94a;--r:#ff5d5d;--b:#4aa8ff}
*{box-sizing:border-box;margin:0}html,body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom));max-width:520px;margin:auto}
header{padding:14px 16px 4px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:20px}h1 span{color:var(--g)}.pill{font-size:11px;padding:3px 9px;border-radius:99px;background:#12281d;color:var(--g)}
.pill.r{background:#3a1414;color:var(--r)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 14px}
.row{display:flex;gap:8px}.row>*{flex:1}.k{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}
.v{font-size:24px;font-weight:700}.v small{font-size:12px;color:var(--mu);font-weight:400}
.tab{display:none}.tab.on{display:block}
nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:auto;display:flex;background:#0a1711;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:10px 0;font-size:11px}nav button.on{color:var(--g)}nav b{display:block;font-size:19px}
input[type=range]{width:100%;accent-color:var(--g)}
.home{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}.home:first-child{border:0}
.bar{height:7px;border-radius:9px;background:#16291f;flex:1;overflow:hidden;position:relative}.bar i{position:absolute;top:0;bottom:0}
.btn{background:var(--g);color:#04130b;border:0;border-radius:12px;padding:10px 14px;font-weight:700}.btn.o{background:#12281d;color:var(--g)}
.trade{padding:9px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}.trade:first-child{border:0}
.msg{padding:9px 12px;border-radius:14px;margin:6px 0;max-width:88%}.u{background:#17402c;margin-left:auto}.a{background:#13251b}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chips button{background:#12281d;color:var(--g);border:1px solid var(--line);border-radius:99px;padding:6px 11px;font-size:12px}
textarea,input[type=text],input[type=number]{width:100%;background:#0a1711;color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit}
.g{color:var(--g)}.y{color:var(--y)}.rr{color:var(--r)}.mu{color:var(--mu);font-size:12px}
.fl{stroke-dasharray:6 6;animation:dash 1s linear infinite;stroke-width:3;stroke-linecap:round}@keyframes dash{to{stroke-dashoffset:-12}}select{background:#12281d;color:var(--g);border:1px solid var(--line);border-radius:99px;padding:4px 8px}label{display:block;margin:8px 0 3px}
</style></head><body>
<header><h1 style="display:flex;gap:8px;align-items:center"><svg width="26" height="26" viewBox="0 0 32 32"><circle cx="16" cy="16" r="15" fill="#12281d" stroke="#3ddc84" stroke-width="2"/><path d="M18 5 9 18h6l-2 9 10-14h-6z" fill="#3ddc84"/></svg>Eco<span>Pulse</span></h1><div><select id="lang"><option value="en">EN</option><option value="hi">हिं</option><option value="te">తె</option></select> <span class="pill" id="wx">simulated sky</span></div></header>
<div class="card" style="margin-top:6px"><div class="row" style="align-items:center"><div><div class="k" data-i="tm">Time of day</div><div class="v" id="clk">12:00</div></div>
<button class="btn o" id="play" style="flex:0 0 auto">▶ Play day</button></div>
<input type="range" id="hr" min="0" max="23" value="12"><div class="mu" id="tar"></div></div>

<section class="tab on" id="t0"><div class="card"><div class="k">Live energy flow</div><svg viewBox="0 0 340 150" width="100%">
<line id="fs" class="fl" x1="62" y1="38" x2="150" y2="72" stroke="#ffc94a"/><line id="fg" class="fl" x1="278" y1="38" x2="190" y2="72" stroke="#ff5d5d"/>
<line id="fb" class="fl" x1="62" y1="118" x2="150" y2="80" stroke="#4aa8ff"/><line id="fh" class="fl" x1="190" y1="80" x2="278" y2="118" stroke="#3ddc84"/>
<circle cx="170" cy="76" r="22" fill="#12281d" stroke="#3ddc84" stroke-width="2"/><text x="170" y="83" text-anchor="middle" font-size="18">⚡</text>
<g font-size="22" text-anchor="middle"><text x="40" y="38">☀️</text><text x="300" y="38">🏭</text><text x="40" y="126">🔋</text><text x="300" y="126">🏘️</text></g>
<g font-size="10" fill="#82a393" text-anchor="middle"><text x="40" y="52">Solar</text><text x="300" y="52">Grid</text><text x="40" y="142">Battery</text><text x="300" y="142">Homes</text></g>
<text id="gx" x="300" y="38" font-size="26" text-anchor="middle" fill="#ff5d5d" style="display:none">✖</text></svg></div>
<div class="row" style="margin:10px 14px 0"><div class="card" style="margin:0"><div class="k" data-i="sol">Solar</div><div class="v g" id="s">0<small> kW</small></div></div>
